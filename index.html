    rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'Plus Jakarta Sans', 'system-ui', 'sans-serif'],
            serif: ['Newsreader', 'Playfair Display', 'Georgia', 'serif'],
            display: ['Inter', 'system-ui', 'sans-serif'],
            reading: ['Newsreader', 'Georgia', 'serif'],
          },
          colors: {
            gold: {
              50: '#FDF9F0',
              100: '#FAF0DB',
              200: '#F2DEB3',
              300: '#E8C87A',
              400: '#D4AF37',
              500: '#C9A227',
              600: '#A8861F',
              700: '#7D6318',
              800: '#564412',
              900: '#30260A',
            },
            dark: {
              700: '#1a1a1f',
              800: '#141418',
              900: '#0d0d10',
              950: '#08080a',
            }
          },
          animation: {
            'fade-in': 'fadeIn 0.8s ease-out forwards',
            'fade-in-up': 'fadeInUp 0.8s ease-out forwards',
            'loader-width': 'loaderWidth 2s ease-in-out forwards',
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: '0' },
              '100%': { opacity: '1' },
            },
            fadeInUp: {
              '0%': { opacity: '0', transform: 'translateY(20px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
            loaderWidth: {
              '0%': { width: '0%' },
              '100%': { width: '100%' },
            }
          }
        },
      },
    }
  </script>
  <style>
    /* Font smoothing for crisp text rendering */
    html {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }

    /* ============================================
       ARTICLE CONTENT TYPOGRAPHY - MASTER CLASS
       ============================================ */

    /* Article container - use reading font */
    .article-content {
      font-family: 'Newsreader', Georgia, serif;
      font-size: 1.125rem;
      /* 18px */
      line-height: 1.6;
      /* 160% Rule */
      max-width: 65ch;
      /* 60-Character Rule */
      margin-left: auto;
      margin-right: auto;
      color: #334155;
      /* slate-700 equivalent */
    }

    .dark .article-content {
      color: #cbd5e1;
      /* slate-300 equivalent */
    }

    /* Paragraphs in articles */
    .article-content p {
      margin-bottom: 1.5em;
      font-weight: 400;
      line-height: 1.6;
    }

    /* List items */
    .article-content li {
      line-height: 1.6;
      margin-bottom: 0.5rem;
    }

    .article-content ul,
    .article-content ol {
      margin-bottom: 1.5em;
    }

    /* Headings in articles - Inter */
    .article-content h1,
    .article-content h2,
    .article-content h3,
    .article-content h4 {
      font-family: 'Inter', system-ui, sans-serif;
      font-weight: 700;
      letter-spacing: -0.02em;
      /* Tight tracking for headings */
      line-height: 1.2;
      /* 120% Rule */
      color: #0f172a;
      /* slate-900 */
      margin-top: 2em;
      margin-bottom: 0.8em;
    }

    .dark .article-content h1,
    .dark .article-content h2,
    .dark .article-content h3,
    .dark .article-content h4 {
      color: #f8fafc;
      /* white/slate-50 */
    }

    /* Hierarchy Scale */
    .article-content h2 {
      font-size: 2rem;
      /* ~32px */
    }

    .article-content h3 {
      font-size: 1.5rem;
      /* ~24px */
    }

    /* Strong text */
    .article-content strong {
      font-weight: 600;
    }

    /* Callout boxes */
    .article-content .p-5,
    .article-content .p-4,
    .article-content .p-6 {
      font-size: 1rem;
      line-height: 1.6;
    }

    /* Custom scrollbar for webkit */
    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: #2a2a30;
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #C9A227;
    }

    .scrollbar-hide::-webkit-scrollbar {
      display: none;
    }

    .scrollbar-hide {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Improved text selection */
    ::selection {
      background-color: rgba(201, 162, 39, 0.3);
      color: #F2DEB3;
    }
  </style>
